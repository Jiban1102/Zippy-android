
name: Build Zippy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "No Android Gradle project found. Add the Android project files first."
            exit 1
          fi

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Zippy-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
